# UNUSED: Skimjob is deployed on AWS Lightsail (owner's choice, 3 Nov), not Fly; see docs/deploy.md.
# Kept for reference: a manual-only Fly.io deploy (Actions → Deploy → Run workflow), main only,
# and only a commit whose CI passed.
name: Deploy

on:
  workflow_dispatch:

# One deploy at a time, in order; a newer run waits rather than cancelling a half-done deploy.
concurrency:
  group: deploy-fly
  cancel-in-progress: false

permissions:
  contents: read
  actions: read # the run checks the commit's CI result

jobs:
  deploy:
    name: Deploy to Fly.io
    # Manual runs on main only.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # FLY_API_TOKEN is not job-wide: only the flyctl steps get it.
    env:
      # Repo variables (Settings → Secrets and variables → Actions → Variables) override these.
      FLY_APP: ${{ vars.FLY_APP || 'skimjob' }}
      FLY_ORG: ${{ vars.FLY_ORG || 'personal' }}
      FLY_REGION: bom
      FLY_VOLUME: skimjob_data
      DEPLOY_SHA: ${{ github.sha }}
    steps:
      - name: Require green CI for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          passed=$(gh api "repos/${{ github.repository }}/actions/workflows/ci.yml/runs?head_sha=$DEPLOY_SHA&event=push&status=success" --jq '.total_count')
          if [ "${passed:-0}" -lt 1 ]; then
            echo "::error title=CI not green::No successful CI run (push to main) for $DEPLOY_SHA; not deploying."
            exit 1
          fi
          echo "CI passed for $DEPLOY_SHA."

      # Third-party actions pinned to full commit SHAs.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # Exactly the commit whose CI was checked above.
          ref: ${{ env.DEPLOY_SHA }}

      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # 1.6

      - name: Check the token
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          if [ -z "$FLY_API_TOKEN" ]; then
            echo "::error title=FLY_API_TOKEN::The FLY_API_TOKEN repo secret is missing or empty."
            exit 1
          fi

      - name: Create the app if missing
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          has_app() { flyctl apps list --json | jq -e --arg a "$FLY_APP" 'any(.[]?; (.Name // .name) == $a)' >/dev/null; }
          if has_app; then
            echo "App $FLY_APP exists."
          elif out=$(flyctl apps create "$FLY_APP" --org "$FLY_ORG" 2>&1); then
            echo "Created app $FLY_APP in org $FLY_ORG."
          elif echo "$out" | grep -qi "already" && has_app; then
            echo "App $FLY_APP exists (created by a concurrent run)."
          else
            echo "$out"
            echo "::error title=Fly app::Could not create the Fly app '$FLY_APP' in org '$FLY_ORG'. If the name is taken by someone else, set the FLY_APP repo variable to a free name (docs/deploy.md)."
            exit 1
          fi

      - name: Create the data volume if missing
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          if flyctl volumes list --app "$FLY_APP" --json | jq -e --arg v "$FLY_VOLUME" 'any(.[]?; (.name // .Name) == $v)' >/dev/null; then
            echo "Volume $FLY_VOLUME exists."
          else
            flyctl volumes create "$FLY_VOLUME" --app "$FLY_APP" --region "$FLY_REGION" --size 1 --yes
          fi

      - name: Deploy
        # Non-secret env comes from fly.toml [env]; PUBLIC_ORIGIN follows the app name.
        # --ha=false: one machine only, because PGlite lives on its one volume.
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: >-
          flyctl deploy --remote-only
          --app "$FLY_APP"
          --ha=false
          --env PUBLIC_ORIGIN=https://$FLY_APP.fly.dev
          --wait-timeout 10m

      - name: Smoke test
        run: |
          url="https://$FLY_APP.fly.dev"
          for i in $(seq 1 20); do
            if curl -fsS "$url/health" && curl -fsS -o /dev/null "$url/join/smoke"; then
              echo; echo "Live: $url"; exit 0
            fi
            sleep 6
          done
          echo "::error title=Smoke test::$url/health did not answer after the deploy."
          exit 1
