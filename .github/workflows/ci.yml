# CI: typecheck, unit + property + integration tests, web e2e, simulator smoke.
# Docs-only PRs (scripts/ci-docs-only.sh) skip e2e and sim smoke; tests always run.
# Nothing deploys from CI: releases go to Lightsail by hand (docs/deploy.md).
# Layers and how to run each locally: docs/testing.md
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # docs_only=true only for a pull_request whose base...head diff is all *.md files.
  # Pushes to main, manual runs and any diff error give false: everything runs.
  changes:
    name: Changed files
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.diff.outputs.docs_only }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          docs_only=false
          if [ "$EVENT" = pull_request ] && files=$(git diff --name-only --no-renames "$BASE...$HEAD"); then
            echo "$files"
            docs_only=$(bash scripts/ci-docs-only.sh <<<"$files") || docs_only=false
          fi
          echo "docs_only=$docs_only"
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"

  test:
    name: Typecheck and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      # macOS and Windows checkouts are case-insensitive: files, directories or TS/JS
      # modules (Crook.tsx + crook.ts, which `./Crook` can't tell apart) whose names
      # differ only in case break the build there. Same-case foo.ts + foo.js is fine.
      - name: No paths or module names that differ only in case
        run: |
          dupes=$(git ls-files | awk '{print; p=$0; sub(/\.(ts|tsx|js|jsx|mjs|cjs)$/,"",p); print p; while (sub(/\/[^\/]*$/,"")) print}' | sort -u | sort -f | uniq -di)
          if [ -n "$dupes" ]; then
            echo "::error::Files, directories or module names that differ only in case (they collide on macOS/Windows). Rename one of each:"
            echo "$dupes"
            exit 1
          fi
      - uses: pnpm/action-setup@v4 # version from package.json "packageManager"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      # Unit, QA, engine property (*.prop.test.ts, seeded) and server scenario (*.int.test.ts, PGlite) tests.
      - run: pnpm test

  e2e:
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    # Six shards in parallel (the heaviest of four took 11 min) (Playwright --shard), each with its own servers (playwright.config.ts).
    name: Web e2e (Playwright, shard ${{ matrix.shard }}/6)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Chromium
        working-directory: apps/web
        run: npx playwright install --with-deps chromium
      - name: Playwright (shard ${{ matrix.shard }}/6)
        working-directory: apps/web
        run: npx playwright test --shard=${{ matrix.shard }}/6
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.shard }}
          path: apps/web/test-results
          if-no-files-found: ignore

  sim-smoke:
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    name: Simulator smoke (200 games at 3/6/12 players)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: bash scripts/sim-smoke.sh 200
