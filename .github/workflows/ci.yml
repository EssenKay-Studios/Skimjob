# CI: typecheck, unit + property + integration tests, web e2e, simulator smoke, Docker image.
# Deploys are manual-only for now (deploy.yml, docs/deploy.md).
# Layers and how to run each locally: docs/testing.md
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Typecheck and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      # macOS and Windows checkouts are case-insensitive: files, directories or TS/JS
      # modules (Crook.tsx + crook.ts, which `./Crook` can't tell apart) whose names
      # differ only in case break the build there. Same-case foo.ts + foo.js is fine.
      - name: No paths or module names that differ only in case
        run: |
          dupes=$(git ls-files | awk '{print; p=$0; sub(/\.(ts|tsx|js|jsx|mjs|cjs)$/,"",p); print p; while (sub(/\/[^\/]*$/,"")) print}' | sort -u | sort -f | uniq -di)
          if [ -n "$dupes" ]; then
            echo "::error::Files, directories or module names that differ only in case (they collide on macOS/Windows). Rename one of each:"
            echo "$dupes"
            exit 1
          fi
      - uses: pnpm/action-setup@v4 # version from package.json "packageManager"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      # Unit, QA, engine property (*.prop.test.ts, seeded) and server scenario (*.int.test.ts, PGlite) tests.
      - run: pnpm test

  e2e:
    # Six shards in parallel (the heaviest of four took 11 min) (Playwright --shard), each with its own servers (playwright.config.ts).
    name: Web e2e (Playwright, shard ${{ matrix.shard }}/6)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Chromium
        working-directory: apps/web
        run: npx playwright install --with-deps chromium
      - name: Playwright (shard ${{ matrix.shard }}/6)
        working-directory: apps/web
        run: npx playwright test --shard=${{ matrix.shard }}/6
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.shard }}
          path: apps/web/test-results
          if-no-files-found: ignore

  sim-smoke:
    name: Simulator smoke (200 games at 3/6/12 players)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: bash scripts/sim-smoke.sh 200

  docker:
    name: Docker image builds and serves
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: docker build --progress=plain -t skimjob:ci .
      # The production image boots (PGlite on a fresh volume, as on Fly) and serves the app, an SPA route and /health.
      - name: Run the image
        run: |
          docker run -d --name skimjob -p 8080:8080 -v skimjob-ci-data:/data -e PUBLIC_ORIGIN=http://localhost:8080 skimjob:ci
          for i in $(seq 1 30); do curl -fsS http://localhost:8080/health && break; sleep 2; done
          curl -fsS http://localhost:8080/health
          page=$(curl -fsS http://localhost:8080/join/abc)
          echo "$page" | grep -q '<div id="root">'
          # The server runs as the unprivileged `node` user (uid 1000), not root.
          test "$(docker exec skimjob awk '/^Uid:/ {print $2}' /proc/1/status)" = 1000
      - if: always()
        run: docker logs skimjob || true
