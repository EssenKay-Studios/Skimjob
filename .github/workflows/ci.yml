# CI: typecheck, unit + property + integration tests, web e2e, simulator smoke, Docker image.
# A green run on main triggers the Fly deploy (deploy.yml, docs/deploy.md).
# Layers and how to run each locally: docs/testing.md
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Typecheck and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # version from package.json "packageManager"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      # Unit, QA, engine property (*.prop.test.ts, seeded) and server scenario (*.int.test.ts, PGlite) tests.
      - run: pnpm test

  e2e:
    name: Web e2e (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Chromium
        working-directory: apps/web
        run: npx playwright install --with-deps chromium
      - run: pnpm test:e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/test-results
          if-no-files-found: ignore

  sim-smoke:
    name: Simulator smoke (200 games at 3/6/12 players)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: bash scripts/sim-smoke.sh 200

  docker:
    name: Docker image builds and serves
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: docker build --progress=plain -t skimjob:ci .
      # The production image boots (PGlite on a fresh volume, as on Fly) and serves the app, an SPA route and /health.
      - name: Run the image
        run: |
          docker run -d --name skimjob -p 8080:8080 -v skimjob-ci-data:/data -e PUBLIC_ORIGIN=http://localhost:8080 skimjob:ci
          for i in $(seq 1 30); do curl -fsS http://localhost:8080/health && break; sleep 2; done
          curl -fsS http://localhost:8080/health
          page=$(curl -fsS http://localhost:8080/join/abc)
          echo "$page" | grep -q '<div id="root">'
          # The server runs as the unprivileged `node` user (uid 1000), not root.
          test "$(docker exec skimjob awk '/^Uid:/ {print $2}' /proc/1/status)" = 1000
      - if: always()
        run: docker logs skimjob || true
