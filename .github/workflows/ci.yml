# CI: typecheck, knip, theme-token lint, unit + property + integration tests, web e2e, simulator smoke.
# Every PR, every push to main and the nightly run (02:17 UTC) run the full tier (docs/testing.md).
# "CI ok" is the one check branch protection and the merge gate need. Nothing deploys from CI: releases go to Lightsail by hand (docs/deploy.md).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 2 * * *"

# Read-only default token: nothing here writes to the repo.
permissions:
  contents: read

# Only PR runs cancel each other: every push to main and every nightly run to the end.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Typecheck and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      # macOS and Windows checkouts are case-insensitive: files, directories or TS/JS
      # modules (Crook.tsx + crook.ts, which `./Crook` can't tell apart) whose names
      # differ only in case break the build there. Same-case foo.ts + foo.js is fine.
      - name: No paths or module names that differ only in case
        run: |
          dupes=$(git ls-files | awk '{print; p=$0; sub(/\.(ts|tsx|js|jsx|mjs|cjs)$/,"",p); print p; while (sub(/\/[^\/]*$/,"")) print}' | sort -u | sort -f | uniq -di)
          if [ -n "$dupes" ]; then
            echo "::error::Files, directories or module names that differ only in case (they collide on macOS/Windows). Rename one of each:"
            echo "$dupes"
            exit 1
          fi
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0 (version from package.json "packageManager")
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      # Fails on unused files, exports and dependencies (knip.json).
      - run: pnpm knip
      # No raw colours, fonts, shadows or radii outside theme.css (scripts/theme-lint.mjs).
      - run: pnpm lint:theme
      # Every e2e test has exactly one feature tag and every feature module has an entry (apps/web/e2e/features.json).
      - run: node scripts/scope.mjs --check
      # Unit, QA, engine property (*.prop.test.ts, seeded) and server scenario (*.int.test.ts, PGlite) tests.
      - run: pnpm test

  e2e:
    # Six shards in parallel, each with its own servers (playwright.config.ts) and a balanced set of spec
    # files (scripts/scope.mjs --shard, weights in apps/web/e2e/shard-weights.json).
    name: Web e2e (Playwright, shard ${{ matrix.shard }}/6)
    runs-on: ubuntu-latest
    # Playwright's own image has Chromium and its system libraries baked in, so the shards never
    # call apt-get: an Ubuntu mirror outage can't fail them (#269). Keep the tag = @playwright/test.
    container: mcr.microsoft.com/playwright:v1.63.0-noble
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0 (version from package.json "packageManager")
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Playwright (shard ${{ matrix.shard }}/6)
        working-directory: apps/web
        run: |
          files=$(node ../../scripts/scope.mjs --shard ${{ matrix.shard }}/6)
          [ -n "$files" ] || exit 0
          # shellcheck disable=SC2086 # one argument per spec file
          npx playwright test --pass-with-no-tests $files
      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report-${{ matrix.shard }}
          path: apps/web/test-results
          if-no-files-found: ignore

  sim-smoke:
    name: Simulator smoke (all-bot games at 3/6/12 players)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0 (version from package.json "packageManager")
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: bash scripts/sim-smoke.sh 200

  # Always runs: passes when every job above passed.
  ci-ok:
    name: CI ok
    needs: [test, e2e, sim-smoke]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
