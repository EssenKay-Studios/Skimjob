# The full simulation suite (docs/testing.md "Running the suite"): the design §17.4
# matrix at 3–12 players, sharded across runners, merged into one report and
# compared with docs/balance/baseline.json. Long, so manual only.
name: Sim suite

on:
  workflow_dispatch:
    inputs:
      shards:
        description: "Runners to split the matrix over (1-50)"
        default: "10"
      ci:
        description: "Target 95% half-width per rate, percentage points"
        default: "2"
      max_games:
        description: "Most games per cell"
        default: "6000"
      overrides:
        description: "Content overrides JSON to try a rule change, e.g. {\"alarm\":{\"bulbs\":5}}"
        default: ""
      extra:
        description: "Other sim:suite options without spaces inside values, e.g. -p 4-8 --setups balanced,hidden"
        default: ""
      strict:
        description: "Fail the run if any check FAILs (confirmed by its 95% interval)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  plan:
    name: Plan shards
    runs-on: ubuntu-latest
    outputs:
      list: ${{ steps.plan.outputs.list }}
    steps:
      - id: plan
        env:
          SHARDS: ${{ inputs.shards }}
        run: |
          case "$SHARDS" in (''|*[!0-9]*) echo "shards must be a whole number"; exit 1;; esac
          if [ "$SHARDS" -lt 1 ] || [ "$SHARDS" -gt 50 ]; then echo "shards must be 1-50"; exit 1; fi
          echo "list=$(node -e 'console.log(JSON.stringify(Array.from({ length: +process.argv[1] }, (_, i) => i + 1)))' "$SHARDS")" >> "$GITHUB_OUTPUT"

  shard:
    name: Shard ${{ matrix.shard }}/${{ inputs.shards }}
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.list) }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run the shard (workers = CPU count)
        env:
          SHARD: ${{ matrix.shard }}/${{ inputs.shards }}
          N: ${{ matrix.shard }}
          CI_PP: ${{ inputs.ci }}
          MAX_GAMES: ${{ inputs.max_games }}
          OVERRIDES: ${{ inputs.overrides }}
          EXTRA: ${{ inputs.extra }}
        run: |
          args=(--shard "$SHARD" --ci "$CI_PP" --max-games "$MAX_GAMES" --out "sim-output/shard-$N.json")
          if [ -n "$OVERRIDES" ]; then args+=(--overrides "$OVERRIDES"); fi
          # $EXTRA is split into words on purpose (several options); never eval'd.
          read -r -a extra <<< "$EXTRA"
          pnpm -s sim:suite -- "${args[@]}" "${extra[@]}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: suite-shard-${{ matrix.shard }}
          path: sim-output/shard-${{ matrix.shard }}.json
          if-no-files-found: error

  merge:
    name: Merge and report
    needs: shard
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: suite-shard-*
          path: sim-output/shards
          merge-multiple: true
      - name: Merge shards, compare with the baseline
        id: merge
        env:
          STRICT: ${{ inputs.strict && '--strict' || '' }}
        run: |
          set +e
          pnpm -s sim:suite -- merge sim-output/shards/*.json --out sim-output/suite.json --compare docs/balance/baseline.json $STRICT > sim-output/suite.txt
          code=$?
          set -e
          cat sim-output/suite.txt
          { echo '```'; cat sim-output/suite.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          echo "code=$code" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: suite-report
          path: |
            sim-output/suite.json
            sim-output/suite.txt
      - name: Checks (with strict)
        if: steps.merge.outputs.code != '0'
        run: |
          echo "sim:suite merge exited ${{ steps.merge.outputs.code }}"
          exit 1
